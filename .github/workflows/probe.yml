name: Probe

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  probe:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain identity
        run: |
          sw_vers
          uname -m
          sysctl -n machdep.cpu.brand_string || true
          sysctl -n hw.ncpu hw.memsize || true
          xcodebuild -version
          xcode-select -p

      - name: Fetch Creative Commons test audio (never committed)
        run: |
          set -u
          mkdir -p Tests/MUProbeKitTests/Audio host-audio
          COUNT=0
          while IFS='|' read -r slug url; do
            case "$slug" in ''|\#*) continue ;; esac
            [ -z "${url:-}" ] && continue
            slug=$(printf '%s' "$slug" | tr -d ' ')
            url=$(printf '%s' "$url" | tr -d ' ')
            ext="${url##*.}"
            case "$ext" in mp3|m4a|wav|flac|aac|aif|aiff) ;; *) ext=mp3 ;; esac
            dest="host-audio/${slug}.${ext}"
            echo "--- fetching $slug"
            if curl -sSL --fail --max-time 240 -o "$dest" "$url"; then
              file "$dest"
              ls -l "$dest"
              cp "$dest" "Tests/MUProbeKitTests/Audio/${slug}.${ext}"
              COUNT=$((COUNT+1))
            else
              echo "!!! download failed: $slug <- $url"
            fi
          done < tracks.txt
          echo "downloaded $COUNT track(s)"
          ls -l Tests/MUProbeKitTests/Audio/ || true

      - name: Probe durations with ffprobe/afinfo
        continue-on-error: true
        run: |
          for f in host-audio/*; do
            [ -f "$f" ] || continue
            echo "=== $f ==="
            afinfo "$f" 2>&1 | head -12 || true
          done

      - name: Create and boot an iOS 27 simulator
        id: sim
        run: |
          set -e
          xcrun simctl list runtimes
          python3 tools/pick_sim.py > /tmp/pick.txt
          RT=$(sed -n 1p /tmp/pick.txt)
          DT=$(sed -n 2p /tmp/pick.txt)
          echo "runtime: $RT"
          echo "devicetype: $DT"
          UDID=$(xcrun simctl create mu-probe-sim "$DT" "$RT")
          echo "udid: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b || true
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "runtime=$RT" >> "$GITHUB_OUTPUT"

      - name: Resolve the package scheme name
        id: scheme
        run: |
          xcodebuild -list | tee /tmp/schemes.txt
          NAME=$(awk '/Schemes:/{f=1;next} f && NF {print $1; exit}' /tmp/schemes.txt)
          echo "scheme: ${NAME:-MUProbe}"
          echo "name=${NAME:-MUProbe}" >> "$GITHUB_OUTPUT"

      - name: Run the probe in the iOS 27 Simulator
        id: simtest
        continue-on-error: true
        run: |
          mkdir -p out
          set -o pipefail
          xcodebuild test \
            -scheme "${{ steps.scheme.outputs.name }}" \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath out/sim.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee out/50-simulator-test.log
          echo "exit=$?"

      - name: Extract simulator timelines from the log
        if: always()
        continue-on-error: true
        run: python3 tools/extract_timelines.py out/50-simulator-test.log out

      - name: Pull report files out of the simulator container
        if: always()
        continue-on-error: true
        run: |
          mkdir -p out/sim-reports
          find /Users/runner/Library/Developer/CoreSimulator/Devices/${{ steps.sim.outputs.udid }} \
               -name "*.sim.timeline.txt" -exec cp {} out/sim-reports/ \; 2>/dev/null || true
          ls -l out/sim-reports/ || true

      - name: Build the macOS host harness
        continue-on-error: true
        run: |
          mkdir -p out
          swift build -c release 2>&1 | tee out/70-host-build.log || true

      - name: Attempt the macOS host run (expected to need macOS 27)
        continue-on-error: true
        run: |
          mkdir -p out
          SPECS=""
          for f in host-audio/*; do
            [ -f "$f" ] || continue
            b=$(basename "$f"); SPECS="$SPECS ${b%.*}=$f"
          done
          echo "specs:$SPECS"
          ( swift run -c release mu-probe out/host-reports $SPECS ) 2>&1 | tee out/71-host-run.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-results
          path: out/
          if-no-files-found: warn
